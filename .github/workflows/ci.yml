name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Delta's jars are downloaded from Maven on the first Spark start; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: make venv

      - name: Test
        run: make test

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      # Checks the files only; nothing is created in Azure.
      - name: Format
        run: terraform fmt -check

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
