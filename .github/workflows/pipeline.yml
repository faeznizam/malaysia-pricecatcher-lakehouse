name: Daily pipeline

# Downloads the latest PriceCatcher data, rebuilds the lake and the report.
# 06:00 UTC = 2pm Malaysia time, after data.gov.my's daily update.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  # The lake is rebuilt from scratch each run, starting from this month.
  START_MONTH: "2026-05"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write   # to open an issue when the run fails
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('requirements.txt') }}

      # Keep downloaded files between runs: past months never change, so only
      # the current month and the lookups are fetched again.
      - uses: actions/cache@v4
        with:
          path: data/landing
          key: landing-${{ github.run_id }}
          restore-keys: landing-

      - name: Install
        id: install
        run: make venv

      - name: Download
        id: download
        run: .venv/bin/python -m pricecatcher.download --since "$START_MONTH"

      - name: Bronze, silver, gold
        id: build
        run: make bronze silver gold

      # A failed check stops here: no report, no deploy, so the live site keeps yesterday's numbers.
      - name: Checks
        id: checks
        run: make check

      - name: Report
        id: report
        run: make report

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: site/

      # Publishing needs GitHub Pages turned on (Settings > Pages > Source: GitHub Actions).
      # Set the repository variable PAGES_ENABLED=true once it is.
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # One open issue per problem: later failures add a comment instead of a new issue.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: |
            Install: ${{ steps.install.outcome }}
            Download: ${{ steps.download.outcome }}
            Bronze, silver, gold: ${{ steps.build.outcome }}
            Checks: ${{ steps.checks.outcome }}
            Report: ${{ steps.report.outcome }}
        run: |
          failed=$(echo "$OUTCOMES" | grep ': failure' | head -1 | cut -d: -f1)
          body=$(printf 'The daily pipeline failed at **%s**. The live report still shows the last good run.\n\nStep results:\n\n```\n%s\n```\n\nLogs: %s\n' "${failed:-an unnamed step}" "$OUTCOMES" "$RUN_URL")
          open=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create pipeline-failure --color d73a4a --description "Daily pipeline failed" --force
            gh issue create --title "Daily pipeline failed: ${failed:-unknown step}" --label pipeline-failure --body "$body"
          fi

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
