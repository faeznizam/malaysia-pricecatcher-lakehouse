name: Daily pipeline

# Downloads the latest PriceCatcher data, rebuilds the lake and the report.
# 06:00 UTC = 2pm Malaysia time, after data.gov.my's daily update.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  # The lake is rebuilt from scratch each run, starting from this month.
  START_MONTH: "2026-05"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('requirements.txt') }}

      # Keep downloaded files between runs: past months never change, so only
      # the current month and the lookups are fetched again.
      - uses: actions/cache@v4
        with:
          path: data/landing
          key: landing-${{ github.run_id }}
          restore-keys: landing-

      - name: Install
        run: make venv

      - name: Download
        run: .venv/bin/python -m pricecatcher.download --since "$START_MONTH"

      - name: Bronze, silver, gold, report
        run: make pipeline

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: site/

      # Publishing needs GitHub Pages turned on (Settings > Pages > Source: GitHub Actions).
      # Set the repository variable PAGES_ENABLED=true once it is.
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
